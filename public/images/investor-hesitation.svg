<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f0f8f0" rx="10" ry="10"/>
  
  <g transform="translate(400, 300)">
    <!-- Investor silhouette -->
    <path d="M-150,-20 C-140,0 -120,20 -90,30 C-60,40 -30,35 0,20 C30,5 50,-20 60,-50 C70,-80 60,-110 40,-130 C20,-150 -10,-155 -40,-145 C-70,-135 -90,-110 -100,-80 C-110,-50 -160,-40 -150,-20 Z" fill="#4a6bc3" opacity="0.7"/>
    
    <!-- Question mark -->
    <g transform="translate(80, -20) scale(1.2)">
      <circle cx="0" cy="0" r="60" fill="#ffeb3b" opacity="0.9"/>
      <path d="M-20,-15 C-20,-35 0,-40 10,-30 C20,-20 15,0 0,10 C-5,15 -5,20 -5,25" stroke="#333" stroke-width="12" fill="none" stroke-linecap="round"/>
      <circle cx="-5" cy="40" r="6" fill="#333"/>
    </g>
    
    <!-- Farm icon -->
    <g transform="translate(-80, 40) scale(0.6)">
      <rect x="-40" y="-10" width="80" height="60" fill="#8bc34a"/>
      <path d="M-60,-10 L0,-50 L60,-10" fill="#5a9367" stroke="#5a9367" stroke-width="5"/>
    </g>
  </g>
  
  <!-- Text at bottom -->
  <text x="400" y="550" font-family="Arial" font-size="24" text-anchor="middle" fill="#2e5c34">Investor's Hesitation</text>
</svg>
