<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f0f8f0" rx="10" ry="10"/>
  
  <g transform="translate(400, 300)">
    <!-- Dashboard/Report -->
    <rect x="-150" y="-100" width="300" height="200" rx="10" ry="10" fill="#ffffff" stroke="#4caf50" stroke-width="5"/>
    
    <!-- Graph elements -->
    <g transform="translate(-80, -20)">
      <!-- Bar chart -->
      <rect x="-40" y="-40" width="20" height="80" fill="#4caf50" opacity="0.8"/>
      <rect x="-10" y="-60" width="20" height="100" fill="#2196f3" opacity="0.8"/>
      <rect x="20" y="-30" width="20" height="70" fill="#ff9800" opacity="0.8"/>
      <rect x="50" y="-50" width="20" height="90" fill="#9c27b0" opacity="0.8"/>
      
      <!-- X and Y axis -->
      <line x1="-50" y1="50" x2="80" y2="50" stroke="#333" stroke-width="2"/>
      <line x1="-50" y1="50" x2="-50" y2="-70" stroke="#333" stroke-width="2"/>
    </g>
    
    <!-- Pie chart -->
    <g transform="translate(80, -20) scale(0.7)">
      <circle cx="0" cy="0" r="70" fill="#ffffff" stroke="#333" stroke-width="2"/>
      <path d="M0,0 L70,0 A70,70 0 0,1 35,60.6 z" fill="#4caf50" opacity="0.8"/>
      <path d="M0,0 L35,60.6 A70,70 0 0,1 -35,60.6 z" fill="#2196f3" opacity="0.8"/>
      <path d="M0,0 L-35,60.6 A70,70 0 0,1 -70,0 z" fill="#ff9800" opacity="0.8"/>
      <path d="M0,0 L-70,0 A70,70 0 0,1 0,-70 z" fill="#9c27b0" opacity="0.8"/>
    </g>
    
    <!-- Text elements -->
    <g transform="translate(0, 70)">
      <line x1="-120" y1="0" x2="120" y2="0" stroke="#e0e0e0" stroke-width="2"/>
      <line x1="-120" y1="20" x2="120" y2="20" stroke="#e0e0e0" stroke-width="2"/>
    </g>
    
    <!-- Magnifying glass (transparency symbol) -->
    <g transform="translate(0, 0) scale(0.5)">
      <circle cx="0" cy="0" r="60" fill="none" stroke="#2196f3" stroke-width="10" opacity="0.5"/>
      <line x1="40" y1="40" x2="80" y2="80" stroke="#2196f3" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
    </g>
  </g>
  
  <!-- Text at bottom -->
  <text x="400" y="550" font-family="Arial" font-size="24" text-anchor="middle" fill="#2e5c34">Transparent Reporting</text>
</svg>
