<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8fffe" rx="10" ry="10"/>
  
  <!-- Greenhouse structure -->
  <g transform="translate(300, 200)">
    <!-- Main greenhouse frame -->
    <path d="M-250,100 L-250,-50 L-200,-100 L200,-100 L250,-50 L250,100 Z" 
          fill="#ffffff" stroke="#cccccc" stroke-width="3" opacity="0.9"/>
    
    <!-- Roof panels -->
    <path d="M-200,-100 L0,-150 L200,-100" fill="#e8f5e9" stroke="#81c784" stroke-width="2"/>
    <line x1="-100" y1="-125" x2="-100" y2="-50" stroke="#cccccc" stroke-width="2"/>
    <line x1="0" y1="-150" x2="0" y2="-50" stroke="#cccccc" stroke-width="2"/>
    <line x1="100" y1="-125" x2="100" y2="-50" stroke="#cccccc" stroke-width="2"/>
    
    <!-- Side panels -->
    <line x1="-200" y1="-50" x2="-200" y2="100" stroke="#cccccc" stroke-width="2"/>
    <line x1="-150" y1="-75" x2="-150" y2="100" stroke="#cccccc" stroke-width="2"/>
    <line x1="-100" y1="-90" x2="-100" y2="100" stroke="#cccccc" stroke-width="2"/>
    <line x1="-50" y1="-95" x2="-50" y2="100" stroke="#cccccc" stroke-width="2"/>
    <line x1="50" y1="-95" x2="50" y2="100" stroke="#cccccc" stroke-width="2"/>
    <line x1="100" y1="-90" x2="100" y2="100" stroke="#cccccc" stroke-width="2"/>
    <line x1="150" y1="-75" x2="150" y2="100" stroke="#cccccc" stroke-width="2"/>
    <line x1="200" y1="-50" x2="200" y2="100" stroke="#cccccc" stroke-width="2"/>
    
    <!-- Growing beds -->
    <rect x="-220" y="60" width="80" height="40" fill="#8bc34a" opacity="0.7"/>
    <rect x="-120" y="60" width="80" height="40" fill="#4caf50" opacity="0.7"/>
    <rect x="-20" y="60" width="80" height="40" fill="#66bb6a" opacity="0.7"/>
    <rect x="80" y="60" width="80" height="40" fill="#81c784" opacity="0.7"/>
    <rect x="180" y="60" width="80" height="40" fill="#a5d6a7" opacity="0.7"/>
    
    <!-- Plants -->
    <g transform="translate(-180, 60)">
      <path d="M0,0 C-5,-10 -10,-15 -15,-20 M0,0 C5,-10 10,-15 15,-20 M0,0 L0,-25" 
            stroke="#2e7d32" stroke-width="3" fill="none"/>
    </g>
    <g transform="translate(-80, 60)">
      <path d="M0,0 C-5,-10 -10,-15 -15,-20 M0,0 C5,-10 10,-15 15,-20 M0,0 L0,-25" 
            stroke="#2e7d32" stroke-width="3" fill="none"/>
    </g>
    <g transform="translate(20, 60)">
      <path d="M0,0 C-5,-10 -10,-15 -15,-20 M0,0 C5,-10 10,-15 15,-20 M0,0 L0,-25" 
            stroke="#2e7d32" stroke-width="3" fill="none"/>
    </g>
    <g transform="translate(120, 60)">
      <path d="M0,0 C-5,-10 -10,-15 -15,-20 M0,0 C5,-10 10,-15 15,-20 M0,0 L0,-25" 
            stroke="#2e7d32" stroke-width="3" fill="none"/>
    </g>
    
    <!-- Farmer figure -->
    <g transform="translate(180, 40)">
      <!-- Head -->
      <circle cx="0" cy="-20" r="8" fill="#d4a574"/>
      <!-- Body -->
      <rect x="-6" y="-12" width="12" height="25" fill="#4a90e2" rx="2"/>
      <!-- Arms -->
      <rect x="-12" y="-8" width="6" height="15" fill="#4a90e2" rx="2"/>
      <rect x="6" y="-8" width="6" height="15" fill="#4a90e2" rx="2"/>
      <!-- Legs -->
      <rect x="-6" y="13" width="5" height="15" fill="#2c3e50" rx="2"/>
      <rect x="1" y="13" width="5" height="15" fill="#2c3e50" rx="2"/>
      <!-- Hat -->
      <ellipse cx="0" cy="-25" rx="10" ry="3" fill="#8bc34a"/>
      <!-- Carrying crate -->
      <rect x="8" y="-5" width="15" height="8" fill="#8bc34a" stroke="#2e7d32" stroke-width="1"/>
    </g>
    
    <!-- Another farmer figure -->
    <g transform="translate(-180, 40)">
      <!-- Head -->
      <circle cx="0" cy="-20" r="8" fill="#d4a574"/>
      <!-- Body -->
      <rect x="-6" y="-12" width="12" height="25" fill="#e74c3c" rx="2"/>
      <!-- Arms -->
      <rect x="-12" y="-8" width="6" height="15" fill="#e74c3c" rx="2"/>
      <rect x="6" y="-8" width="6" height="15" fill="#e74c3c" rx="2"/>
      <!-- Legs -->
      <rect x="-6" y="13" width="5" height="15" fill="#2c3e50" rx="2"/>
      <rect x="1" y="13" width="5" height="15" fill="#2c3e50" rx="2"/>
      <!-- Working on plants -->
      <circle cx="-15" cy="5" r="3" fill="#4caf50"/>
    </g>
    
    <!-- Walkway -->
    <rect x="-250" y="100" width="500" height="20" fill="#e0e0e0"/>
    <line x1="-250" y1="110" x2="250" y2="110" stroke="#bdbdbd" stroke-width="2"/>
  </g>
</svg>
