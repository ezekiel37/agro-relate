<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f0f8f0" rx="10" ry="10"/>
  <g transform="translate(400, 300)">
    <!-- Farmer silhouette -->
    <path d="M-100,-50 C-120,-30 -130,0 -120,30 C-110,60 -90,80 -60,90 C-30,100 0,90 20,70 C40,50 50,20 40,-10 C30,-40 10,-60 -20,-70 C-50,-80 -80,-70 -100,-50 Z" fill="#5a9367" opacity="0.8"/>
    
    <!-- Money bag -->
    <g transform="translate(80, 0) scale(0.8)">
      <path d="M-30,-60 C-40,-50 -45,-30 -40,0 C-35,30 -20,50 0,60 C20,70 40,60 50,40 C60,20 60,-10 50,-30 C40,-50 20,-60 0,-60 C-15,-60 -25,-65 -30,-60 Z" fill="#8bc34a"/>
      <text x="0" y="15" font-family="Arial" font-size="40" text-anchor="middle" fill="#2e5c34">$</text>
    </g>
    
    <!-- Red X mark -->
    <g transform="translate(0, 0) scale(1.2)">
      <line x1="-30" y1="-30" x2="30" y2="30" stroke="#d32f2f" stroke-width="10" stroke-linecap="round"/>
      <line x1="30" y1="-30" x2="-30" y2="30" stroke="#d32f2f" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Text at bottom -->
  <text x="400" y="550" font-family="Arial" font-size="24" text-anchor="middle" fill="#2e5c34">Lack of Funding</text>
</svg>
