<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Farmer with plant -->
  <circle cx="100" cy="100" r="80" fill="#f9f9e0" opacity="0.3"/>
  
  <g transform="translate(100, 100) scale(0.8)">
    <!-- Farmer silhouette -->
    <path d="M-20,-40 C-30,-30 -35,-10 -30,10 C-25,30 -10,40 10,40 C30,40 40,30 45,10 C50,-10 45,-30 35,-40 C25,-50 10,-50 -5,-45 C-15,-45 -15,-45 -20,-40 Z" fill="#8CC63F" opacity="0.8"/>
    
    <!-- Hat -->
    <path d="M-15,-45 C-5,-55 15,-55 25,-45 C30,-40 30,-35 25,-30 C15,-25 5,-25 -5,-30 C-15,-35 -20,-40 -15,-45 Z" fill="#8CC63F"/>
    
    <!-- Plant -->
    <path d="M-5,0 C-5,-20 0,-30 10,-40 C20,-30 25,-20 25,0" fill="none" stroke="#8CC63F" stroke-width="5"/>
    <line x1="10" y1="-40" x2="10" y2="40" stroke="#8CC63F" stroke-width="5"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="180" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">For Farmers</text>
</svg>
